<canvas id="c"></canvas>
<div id="label"></div>
<div id="work"></div>

<script src="tests.js"></script>
<script>
  document.getElementById('label').textContent = 'sketch ' + SBL;
  // 動いていることが目で分かるように背景色を変える
  const c = document.getElementById('c');
  const gl = c.getContext('webgl2');
  let k = 0;
  const loop = () => { k++; gl.clearColor(0.1 + 0.1 * Math.sin(k / 30), 0.12, 0.2, 1); gl.clear(gl.COLOR_BUFFER_BIT); __sb_real.raf(loop); };
  loop();
