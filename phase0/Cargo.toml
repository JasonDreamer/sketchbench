[package]
name = "sb-phase0"
version = "0.0.0"
edition = "2021"
publish = false
description = "Sketchbench フェーズ0 技術検証用の最小Tauriアプリ"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_Com_StructuredStorage",
  "Win32_UI_Shell",
  "Win32_System_Threading",
  "Win32_System_ProcessStatus",
  "Win32_System_SystemInformation",
  "Win32_System_Memory",
  "Win32_Graphics_Gdi",
] }
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
axum = "0.8"
tokio = { version = "1", features = ["rt-multi-thread", "net", "macros", "sync", "time"] }
tower-http = { version = "0.6", features = ["cors"] }
sysinfo = "0.37"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
