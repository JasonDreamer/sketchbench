[package]
name = "sketchbench"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
default-run = "sketchbench"
description = "映像制作用の自分専用ビジュアルコーディング環境"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
  "Win32_System_Com_StructuredStorage",
  "Win32_System_Memory",
  "Win32_Security",
  "Win32_Security_Authorization",
  "Win32_System_Threading",
] }
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = { version = "1", features = ["preserve_order"] }
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "net", "io-util", "io-std"] }
notify = "8.2"
oxc = { version = "=0.158.0", features = ["transformer", "codegen", "semantic"] }
isf = "0.1"
png = "0.18"
blake3 = "1"
symphonia = { version = "0.6", features = ["all"] }
rubato = "3"
rustfft = "6"
cpal = "0.18"
beat-this = { version = "=1.1.0", default-features = false }
midly = "0.5.3"
midir = "0.11"
rmcp = { version = "3.9.0", features = ["server", "macros", "transport-async-rw", "schemars"] }
jsonschema = { version = "0.61", default-features = false }
schemars = "1"
uuid = { version = "1", features = ["v4"] }
base64 = "0.22"
tauri-plugin-single-instance = "2"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
