[package]
name = "sketchbench"
version = "0.1.0"
edition = "2021"
rust-version = "1.97"
publish = false
description = "映像制作用の自分専用ビジュアルコーディング環境"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "=2.12.5", features = ["unstable"] }
webview2-com = "0.39"
windows = { version = "0.62", features = [
  "Win32_Foundation",
  "Win32_System_Com",
  "Win32_System_SystemInformation",
] }
windows-core = "0.62"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
notify = "8.2"
oxc = { version = "=0.158.0", features = ["transformer", "codegen", "semantic"] }
isf = "0.1"
png = "0.18"
blake3 = "1"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 2
